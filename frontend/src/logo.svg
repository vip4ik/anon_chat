<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a2a"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0a0a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0b8ff"/>
    </linearGradient>
    <linearGradient id="rocketFin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffff00"/>
      <stop offset="40%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#ff3838" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Фон с закруглёнными углами -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Свечение -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Звёзды -->
  <circle cx="90" cy="120" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="150" cy="80" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="420" cy="140" r="3" fill="#00ffff" opacity="0.9"/>
  <circle cx="80" cy="380" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="440" cy="400" r="3" fill="#a855f7" opacity="0.8"/>
  <circle cx="120" cy="280" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="400" cy="280" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="320" cy="90" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="200" cy="440" r="2" fill="#00ffff" opacity="0.7"/>
  <circle cx="380" cy="460" r="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- Планета (маленькая, сзади) -->
  <circle cx="100" cy="200" r="18" fill="#a855f7" opacity="0.35"/>
  <ellipse cx="100" cy="200" rx="28" ry="5" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5" transform="rotate(-20 100 200)"/>

  <!-- Ракета -->
  <g filter="url(#softGlow)">
    <!-- Корпус -->
    <path d="M256 130 
             C 256 130, 220 180, 220 250 
             L 220 340 
             L 256 370 
             L 292 340 
             L 292 250 
             C 292 180, 256 130, 256 130 Z" 
          fill="url(#rocketBody)" 
          stroke="#00ffff" 
          stroke-width="3"/>

    <!-- Иллюминатор -->
    <circle cx="256" cy="230" r="22" fill="#0a0a2a" stroke="#00ffff" stroke-width="3"/>
    <circle cx="256" cy="230" r="12" fill="#00ffff" opacity="0.8"/>
    <circle cx="250" cy="224" r="4" fill="#ffffff" opacity="0.9"/>

    <!-- Носовой обтекатель -->
    <path d="M256 130 C 256 130, 240 145, 235 165 L 277 165 C 272 145, 256 130, 256 130 Z" 
          fill="#ff6b6b" 
          stroke="#c0392b" 
          stroke-width="2"/>

    <!-- Левый стабилизатор -->
    <path d="M 220 320 L 185 380 L 185 400 L 220 380 Z" 
          fill="url(#rocketFin)" 
          stroke="#c0392b" 
          stroke-width="2"/>

    <!-- Правый стабилизатор -->
    <path d="M 292 320 L 327 380 L 327 400 L 292 380 Z" 
          fill="url(#rocketFin)" 
          stroke="#c0392b" 
          stroke-width="2"/>

    <!-- Двигатель -->
    <rect x="240" y="370" width="32" height="15" rx="3" fill="#333" stroke="#00ffff" stroke-width="2"/>

    <!-- Пламя -->
    <path d="M 240 385 
             Q 256 430, 272 385 
             Q 268 420, 256 445 
             Q 244 420, 240 385 Z" 
          fill="url(#flame)"/>
    <path d="M 250 385 
             Q 256 415, 262 385 
             Q 259 410, 256 425 
             Q 253 410, 250 385 Z" 
          fill="#ffff00" 
          opacity="0.9"/>
  </g>
</svg>